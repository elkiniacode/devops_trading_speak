# E2E run in containers: the production image plus a Playwright runner.
#   docker compose -f test/docker-compose.test.yml up --build --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down
# The app has no volume, so every run starts from a fresh seeded DB. Reports and failure
# artifacts land in test/playwright-report and test/test-results on the host.
name: finally-e2e

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      SIM_SEED: "42"
      OPENROUTER_API_KEY: ""
      MASSIVE_API_KEY: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble # keep in step with @playwright/test in package.json
    depends_on:
      app:
        condition: service_healthy
    working_dir: /e2e
    environment:
      BASE_URL: http://app:8000
      CI: "true"
    ipc: host
    volumes:
      - ./:/e2e
      - /e2e/node_modules # container-only install; never touches the host's node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
