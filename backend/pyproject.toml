[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend: FastAPI API, SSE price stream, SQLite, market data and LLM chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
