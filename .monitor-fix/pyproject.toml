[project]
name = "agent-monitor"
version = "0.1.0"
description = "Live and replay view of Claude Code agent teams: tasks, steps and messages over REST + SSE"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
